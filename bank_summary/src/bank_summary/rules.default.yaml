# Your categorisation rules. Evaluated top-to-bottom, first match wins, and BEFORE the
# built-in Danish rule set that ships with the add-on (supermarkets, fuel, streaming,
# utilities, insurance, ...). Add rules here for anything personal, or to override a
# built-in one. The add-on's Categorise page appends rules to this file for you.
#
# Matchers: text_regex (counterparty, remittance text, or the cleaned-up merchant name),
# counterparty_regex, remittance_regex, mcc (list of merchant category codes),
# bank_transaction_code (string or list), credit_debit_indicator (CRDT/DBIT),
# amount_min / amount_max (compared against the absolute amount).

- category: Salary
  match: { credit_debit_indicator: CRDT, text_regex: "(?i)your-employer" }
