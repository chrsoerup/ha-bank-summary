# ---- Money ------------------------------------------------------------------------------
- category: Cash
  match: { text_regex: '(?i)h[æa]veautomat|kontanth[æa]vning|\batm\b|udbetaling\s*automat' }
- category: Pension & savings
  match: { text_regex: '(?i)\bpfa\b|pensiondanmark|industriens\s*pension|\bdanica\b|\bvelliv\b|mp\s*pension|akademikerpension|nordnet|saxo\s*bank|opsparing|aldersopsparing' }
- category: Union & unemployment insurance
  match: { text_regex: '(?i)a-?kasse|fagforening|\bdj[øo]f\b|\bkrifa\b|\blederne\b|dansk\s*metal|ida\s*a-?kasse|\bhk\s*danmark' }
- category: Fees & interest
  match: { text_regex: '(?i)gebyr|\brenter?\b|kortgebyr|[åa]rsgebyr|overtr[æa]k' }
- category: Tax
  match: { credit_debit_indicator: DBIT, text_regex: '(?i)\bskat\b|skattestyrelsen|restskat|motorstyrelsen|v[æa]gtafgift' }

