- category: Subscriptions
  match: { text_regex: '(?i)netflix|spotify|\bhbo\b|\bmax\.com\b|disney\s*(plus|\+)|viaplay|tv\s*2\s*play|apple\.com/bill|itunes|youtube|amazon\s*prime|prime\s*video|storytel|mofibo|podimo|nextory|chatgpt|openai|anthropic|claude\.ai|dropbox|icloud|google\s*(one|storage|play)|microsoft\s*(365|\*)|\bdr\s*licens' }
