# Built-in rules for Danish accounts. Ships with the add-on and is evaluated AFTER your own
# /config/rules.yaml, so anything you define there wins. Don't edit this copy — it is replaced
# on every add-on update. To override a rule, add one for the same merchant to rules.yaml.
#
# text_regex matches the counterparty, the remittance text, or the normalised merchant
# (payment prefixes like "Dankort-nota", card masks, dates and reference numbers removed).
# Regexes are single-quoted so backslashes are literal.

# ---- Income (credits only) -------------------------------------------------------------
- category: Salary
  match: { credit_debit_indicator: CRDT, text_regex: '(?i)\bl[øo]n(overf[øo]rsel)?\b|\bloen\b|feriepenge|ferietill[æa]g' }
- category: Benefits
  match: { credit_debit_indicator: CRDT, text_regex: '(?i)udbetaling\s*danmark|b[øo]rne-?\s*og\s*ungeydelse|b[øo]rnecheck|boligst[øo]tte|statens\s*uddannelsesst[øo]tte' }
- category: Tax
  match: { credit_debit_indicator: CRDT, text_regex: '(?i)\bskat\b|skattestyrelsen|overskydende\s*skat' }

# ---- Everyday ---------------------------------------------------------------------------
- category: Groceries
  match: { text_regex: '(?i)\bnetto\b|rema\s*1000|\brema\b|f[øo]tex|\bbilka\b|\blidl\b|\baldi\b|coop\s*365|365\s*discount|kvickly|superbrugsen|dagli.?\s*brugsen|\bbrugsen\b|\bmeny\b|\bspar\b(?!\s*nord)|min\s*k[øo]bmand|l[øo]vbjerg|\birma\b|nemlig\.?com|7-?eleven' }
- category: Restaurants & cafés
  match: { text_regex: '(?i)mcdonald|burger\s*king|sunset\s*boulevard|max\s*burgers|joe\s*&?\s*the\s*juice|espresso\s*house|baresso|starbucks|lagkagehuset|emmerys|\bwolt\b|just\s*eat|hungry\.dk|domino|pizza|\bcaf[eé]\b|restaurant|bageri?\b|sushi|kebab|grill\b' }
- category: Fuel & charging
  match: { text_regex: '(?i)circle\s*k|\bq8\b|\bf24\b|\bshell\b|uno-?x|\bingo\b|\bok\s+(plus|benzin|tank)|\bclever\b|\bmonta\b|spirii|e\.?on\s*drive|tesla\s*supercharg' }
- category: Transport
  match: { text_regex: '(?i)\bdsb\b|rejsekort|\bmovia\b|\bmetro(selskabet)?\b|midttrafik|fynbus|nordjyllands\s*trafik|\barriva\b|flixbus|letbane|easypark|apcoa|parkman|onepark|parkering|brobizz|storeb[æa]lt|[øo]resundsbro|sund\s*&\s*b[æa]lt|\btaxa\b|dantaxi|\buber\b|\bbolt\b' }

# ---- Home & bills -----------------------------------------------------------------------
- category: Housing
  match: { text_regex: '(?i)boligselskab|boligforening|husleje|ejerforening|andelsbolig|grundejerforening|realkredit|totalkredit|brf\s*kredit|dlr\s*kredit|ejendomsskat' }
- category: Utilities
