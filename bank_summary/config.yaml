name: Bank Summary
version: "0.1.3"
slug: bank_summary
description: >-
  Syncs transactions from a personal bank account via Enable Banking, categorises them, publishes
  live sensors, and archives a per-month Markdown report.
url: "https://github.com/chrsoerup/ha-bank-summary"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:bank
homeassistant_api: true
map:
  - addon_config:rw
options:
  application_id: ""
  private_key_path: "enablebanking_private_key.pem"
  aspsp_name: ""
  aspsp_country: "DK"
  environment: "sandbox"
  redirect_url: ""
  account_uid: ""
  currency: "DKK"
  sync_interval_hours: 24
  consent_expiring_soon_days: 14
schema:
  application_id: str?
  private_key_path: str?
  aspsp_name: str?
  aspsp_country: str
  environment: list(sandbox|production)
  redirect_url: str?
  account_uid: str?
  currency: str
  sync_interval_hours: int(1,24)
  consent_expiring_soon_days: int(1,90)
